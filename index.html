<script>
// ══════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════
const C = document.getElementById('c');
const ctx = C.getContext('2d');

const W = 390, H = 700;
let scale = 1;
function resize(){
  const sw=Math.min(window.innerWidth-8,430);
  const sh=window.innerHeight-8;
  scale=Math.min(sw/W,sh/H);
  C.width=W; C.height=H;
  C.style.width=(W*scale)+'px';
  C.style.height=(H*scale)+'px';
}
resize();
window.addEventListener('resize',resize);

// ══ WORLD DEFINITIONS ══════════════════════════════════
const WORLDS = [

    skyTop:'#0a1a2e', skyBot:'#1a3a1a',
    pipeCol:'#2d8c2d', pipeLite:'#44cc44', pipeDark:'#1a5c1a', pipeCapCol:'#3aaa3a',
    groundTop:'#5c3a1a', groundMid:'#8B5e3c', groundBot:'#3a2010',

  },

    unlockMsg:'Score 10 to unlock'
  },
  {

    skyTop:'#1a0000', skyBot:'#4a0a00',
    pipeCol:'#8c2200', pipeLite:'#ff5500', pipeDark:'#440a00', pipeCapCol:'#cc3300',
    groundTop:'#3a1a00', groundMid:'#5a2200', groundBot:'#1a0800',
    groundGrassCol:'#ff4400',
    bgDeco:'fire',
    birdCol:'#ff6600', birdWing:'#cc3300',
    particleA:'#ff4400', particleB:'#ffaa00',
    pipeSpeed:3.2, pipeGap:140,
    music:'🔥',
    unlockMsg:'Score 25 to unlock'
  },
  {

    pipeCol:'#6a0020', pipeLite:'#cc0044', pipeDark:'#2a0008', pipeCapCol:'#880033',
    groundTop:'#1a0008', groundMid:'#2a000e', groundBot:'#0a0004',
    groundGrassCol:'#880022',
    bgDeco:'hell',
    birdCol:'#cc0044', birdWing:'#880022',
    particleA:'#cc0044', particleB:'#ff4488',
    pipeSpeed:3.6, pipeGap:132,
    music:'😈',
    unlockMsg:'Score 45 to unlock'
  },
  {
    id:'angel', name:'👼 Heaven', unlockAt:70,
    skyTop:'#e8f4ff', skyBot:'#ffffff',
    pipeCol:'#c8a800', pipeLite:'#ffe066', pipeDark:'#8a7000', pipeCapCol:'#d4b800',
    groundTop:'#fff8e0', groundMid:'#ffe8a0', groundBot:'#d4c070',
    groundGrassCol:'#ffffff',
    bgDeco:'angel',
    birdCol:'#ffffff', birdWing:'#e8e8ff',
    particleA:'#ffe066', particleB:'#ffffff',
    pipeSpeed:3.0, pipeGap:160,
    music:'👼',
    unlockMsg:'Score 70 to unlock'
  }
];

// ══ GAME CONSTANTS ══════════════════════════════════════
const GRAVITY=0.40, FLAP_VEL=-7.8;
const PIPE_W=60, GROUND_H=80, BIRD_X=90;

// ══ STATE ══════════════════════════════════════════════
let bird,pipes,score,best,state,frame,particles,floatParticles;
let currentWorldIdx=0;
let worldTransition=0; // 0-1 for transition effect
let screenShake=0;
let combo=0, comboTimer=0;

// Best scores per world
let worldBests = WORLDS.map(()=>0);

function getWorld(){ return WORLDS[currentWorldIdx]; }

function initGame(){
  const w=getWorld();
  bird={y:H/2-40,vy:0,angle:0,flapFrame:0,alive:true,trail:[]};
  pipes=[];score=0;frame=0;particles=[];floatParticles=[];
  state='idle';combo=0;comboTimer=0;screenShake=0;
  if(best===undefined) best=0;
  spawnFloatParticles();
}
initGame();

// ══ FLOAT PARTICLES (ambient) ══════════════════════════
function spawnFloatParticles(){
  floatParticles=[];
  const w=getWorld();
  for(let i=0;i<30;i++){
    floatParticles.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-0.5)*0.4,
      vy:-0.3-Math.random()*0.5,
      size:Math.random()*3+1,
      alpha:Math.random()*0.6+0.2,
      col:Math.random()>0.5?w.particleA:w.particleB
    });
  }
}

// ══ INPUT ══════════════════════════════════════════════
function flap(){
  if(state==='menu'||state==='worldselect') return;
  if(state==='idle'){state='playing';bird.vy=FLAP_VEL;spawnFlapParticles();return;}
  if(state==='playing'){bird.vy=FLAP_VEL;bird.flapFrame=10;spawnFlapParticles();}
  if(state==='dead'){initGame();}
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap();}
});
C.addEventListener('pointerdown',e=>{e.preventDefault();flap();});

// ══ PARTICLES ══════════════════════════════════════════
function spawnFlapParticles(){
  const w=getWorld();
  for(let i=0;i<7;i++){
    particles.push({
      x:BIRD_X-10,y:bird.y+8,
      vx:-1.5-Math.random()*2.5,
      vy:(Math.random()-0.5)*3,
      life:1,size:3+Math.random()*3,
      col:Math.random()>0.5?w.particleA:w.particleB
    });
  }
}

function spawnDeathParticles(){
  const w=getWorld();
  for(let i=0;i<30;i++){
    const a=(i/30)*Math.PI*2;
    const s=2+Math.random()*5;
    particles.push({
      x:BIRD_X,y:bird.y,
      vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,
      life:1,size:4+Math.random()*4,
      col:[w.particleA,w.particleB,'#ffffff'][Math.floor(Math.random()*3)]
    });
  }
}

function spawnScoreParticles(){
  const w=getWorld();
  for(let i=0;i<12;i++){
    particles.push({
      x:BIRD_X+20+Math.random()*60,y:bird.y-20+Math.random()*40,
      vx:(Math.random()-0.5)*4,vy:-2-Math.random()*3,
      life:1,size:2+Math.random()*3,
      col:i%2===0?'#ffdd00':'#ffffff'
    });
  }
}

// ══ PIPES ══════════════════════════════════════════════
function spawnPipe(){
  const w=getWorld();
  const minY=90,maxY=H-GROUND_H-w.pipeGap-90;
  const topH=minY+Math.random()*(maxY-minY);
  pipes.push({x:W+20,topH,scored:false});
}

// ══ COLLISION ══════════════════════════════════════════
function checkCollision(){
  const BR=14;
  if(bird.y+BR>=H-GROUND_H)return true;
  if(bird.y-BR<=0)return true;
  for(const p of pipes){
    const inX=BIRD_X+BR>p.x+5&&BIRD_X-BR<p.x+PIPE_W-5;
    if(inX&&(bird.y-BR<p.topH||bird.y+BR>p.topH+getWorld().pipeGap))return true;
  }
  return false;
}

// ══ UPDATE ══════════════════════════════════════════════
let pipeTimer=0;
function update(){
  frame++;
  if(screenShake>0)screenShake-=0.5;

  // Float particles ambient
  for(const p of floatParticles){
    p.x+=p.vx; p.y+=p.vy;
    if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
    if(p.x<-10)p.x=W+10;
    if(p.x>W+10)p.x=-10;
  }

  if(state!=='playing')return;

  // Bird
  bird.vy+=GRAVITY;
  bird.vy=Math.min(bird.vy,12);
  bird.y+=bird.vy;
  bird.angle=Math.max(-30,Math.min(95,bird.vy*4.5));
  if(bird.flapFrame>0)bird.flapFrame--;

  // Trail
  bird.trail.push({x:BIRD_X,y:bird.y,a:0.6});
  if(bird.trail.length>12)bird.trail.shift();
  for(const t of bird.trail)t.a-=0.05;

  // Combo
  if(comboTimer>0)comboTimer--;
  else combo=0;

  // Pipes
  const w=getWorld();
  pipeTimer++;
  if(pipeTimer>=(85-score*0.3|0)||(pipeTimer>=50)){
    if(pipeTimer>=(Math.max(55,85-score*0.3|0))){
      spawnPipe();pipeTimer=0;
    }
  }

  for(const p of pipes){
    p.x-=w.pipeSpeed+(score*0.03);
    if(!p.scored&&p.x+PIPE_W<BIRD_X){
      p.scored=true;score++;
      combo++;comboTimer=120;
      if(score>best)best=score;
      if(score>worldBests[currentWorldIdx])worldBests[currentWorldIdx]=score;
      spawnScoreParticles();
      if(combo>=3)screenShake=6;
    }
  }
  pipes=pipes.filter(p=>p.x>-PIPE_W-20);

  // Particles
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.035;
  }
  particles=particles.filter(p=>p.life>0);

  // Collision
  if(checkCollision()){
    state='dead';screenShake=14;
    spawnDeathParticles();
  }
}

// ══ DRAW HELPERS ══════════════════════════════════════
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ══ DRAW SKY + BG DECO ════════════════════════════════
function drawSky(){
  const w=getWorld();
  const g=ctx.createLinearGradient(0,0,0,H-GROUND_H);
  g.addColorStop(0,w.skyTop);g.addColorStop(1,w.skyBot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawBgDeco(){
  const w=getWorld();
  if(w.bgDeco==='forest') drawForestBg();
  else if(w.bgDeco==='ice') drawIceBg();
  else if(w.bgDeco==='fire') drawFireBg();
  else if(w.bgDeco==='hell') drawHellBg();
  else if(w.bgDeco==='angel') drawAngelBg();
}

// --- Forest ---
function drawForestBg(){
  // Stars
  ctx.fillStyle='rgba(255,255,255,0.7)';
  for(let i=0;i<40;i++){
    const sx=((i*137)%W);const sy=((i*91)%(H*0.6));
    const tw=Math.sin(frame*0.04+i)*0.5+0.5;
    ctx.globalAlpha=0.2+tw*0.6;
    ctx.beginPath();ctx.arc(sx,sy,0.8+tw*0.8,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // Moon
  ctx.fillStyle='#fff8cc';
  ctx.beginPath();ctx.arc(320,70,28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(10,26,46,0.4)';
  ctx.beginPath();ctx.arc(328,65,22,0,Math.PI*2);ctx.fill();
  // Far trees
  ctx.fillStyle='#0d2a0d';
  for(let i=0;i<8;i++){
    const tx=i*55+((frame*0.3)%55)-20;
    const th=80+Math.sin(i*2.1)*30;
    ctx.beginPath();
    ctx.moveTo(tx,H-GROUND_H);
    ctx.lineTo(tx+28,H-GROUND_H-th);
    ctx.lineTo(tx+56,H-GROUND_H);
    ctx.fill();
  }
}

// --- Ice ---
let iceSnow=[];
function drawIceBg(){
  if(iceSnow.length===0){
    for(let i=0;i<50;i++) iceSnow.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1,v:0.5+Math.random()*1});
  }
  // Aurora
  for(let i=0;i<3;i++){
    const g=ctx.createLinearGradient(0,80+i*40,0,180+i*40);
    g.addColorStop(0,'rgba(100,220,255,0)');
    g.addColorStop(0.5,`rgba(100,220,255,${0.08+Math.sin(frame*0.03+i)*0.04})`);
    g.addColorStop(1,'rgba(100,220,255,0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,80+i*40,W,100);
  }
  // Snow
  ctx.fillStyle='rgba(255,255,255,0.8)';
  for(const s of iceSnow){
    s.y+=s.v;s.x+=Math.sin(frame*0.02+s.y*0.01)*0.3;
    if(s.y>H-GROUND_H)s.y=0;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();
  }
  // Ice mountains bg
  ctx.fillStyle='rgba(180,220,255,0.15)';
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(i*90-20,H-GROUND_H);
    ctx.lineTo(i*90+50,H-GROUND_H-120-i*15);
    ctx.lineTo(i*90+110,H-GROUND_H);
    ctx.fill();
  }
}

// --- Fire ---
let fireEmbers=[];
function drawFireBg(){
  if(fireEmbers.length===0){
    for(let i=0;i<40;i++) fireEmbers.push({x:Math.random()*W,y:H-GROUND_H-Math.random()*200,vx:(Math.random()-0.5)*1.5,vy:-0.8-Math.random()*1.5,life:Math.random(),s:Math.random()*3+1});
  }
  // Lava glow ground
  const g=ctx.createLinearGradient(0,H-GROUND_H-80,0,H-GROUND_H);
  g.addColorStop(0,'rgba(255,80,0,0)');
  g.addColorStop(1,`rgba(255,80,0,${0.3+Math.sin(frame*0.05)*0.1})`);
  ctx.fillStyle=g;ctx.fillRect(0,H-GROUND_H-80,W,80);
  // Embers
  for(const e of fireEmbers){
    e.x+=e.vx+Math.sin(frame*0.03+e.y*0.01)*0.5;
    e.y+=e.vy;e.life-=0.008;
    if(e.life<=0||e.y<0){
      e.x=Math.random()*W;e.y=H-GROUND_H-20;
      e.vx=(Math.random()-0.5)*1.5;e.vy=-0.8-Math.random()*1.5;e.life=0.8+Math.random()*0.2;
    }
    ctx.globalAlpha=e.life*0.8;
    ctx.fillStyle=e.life>0.5?'#ffaa00':'#ff4400';
    ctx.beginPath();ctx.arc(e.x,e.y,e.s*e.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // Fire towers bg
  for(let i=0;i<4;i++){
    const tx=i*110+10;
    ctx.fillStyle='rgba(80,10,0,0.6)';
    ctx.fillRect(tx,H-GROUND_H-90,25,90);
    ctx.fillStyle=`rgba(255,60,0,${0.4+Math.sin(frame*0.1+i)*0.2})`;
    ctx.beginPath();ctx.arc(tx+12,H-GROUND_H-90,18,0,Math.PI*2);ctx.fill();
  }
}

// --- Hell ---
let hellParticles=[];
function drawHellBg(){
  if(hellParticles.length===0){
    for(let i=0;i<25;i++) hellParticles.push({x:Math.random()*W,y:Math.random()*(H-GROUND_H),vx:(Math.random()-0.5)*0.8,vy:-0.5-Math.random(),r:Math.random()*3+1,life:Math.random()});
  }
  // Pulsing evil glow
  const pulse=Math.sin(frame*0.04)*0.5+0.5;
  const g=ctx.createRadialGradient(W/2,H,10,W/2,H,400);
  g.addColorStop(0,`rgba(180,0,50,${0.3+pulse*0.15})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Flying bats
  for(let i=0;i<5;i++){
    const bx=((frame*0.8+i*80)%W+W)%W;
    const by=80+i*50+Math.sin(frame*0.05+i)*20;
    ctx.fillStyle='rgba(80,0,30,0.7)';
    ctx.beginPath();
    ctx.ellipse(bx-10,by,8,4,Math.sin(frame*0.2+i)*0.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();
    ctx.ellipse(bx+10,by,8,4,-Math.sin(frame*0.2+i)*0.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(bx,by,4,0,Math.PI*2);ctx.fill();
  }
  // Dark spires
  ctx.fillStyle='rgba(40,0,15,0.8)';
  for(let i=0;i<6;i++){
    const sx=i*70-10;
    const sh=60+i%3*40;
    ctx.beginPath();
    ctx.moveTo(sx,H-GROUND_H);ctx.lineTo(sx+18,H-GROUND_H-sh);ctx.lineTo(sx+36,H-GROUND_H);
    ctx.fill();
  }
  // Hell particles
  for(const p of hellParticles){
    p.x+=p.vx;p.y+=p.vy;p.life-=0.006;
    if(p.life<=0||p.y<0){p.x=Math.random()*W;p.y=H-GROUND_H;p.life=0.7+Math.random()*0.3;}
    ctx.globalAlpha=p.life*0.7;
    ctx.fillStyle='#cc0044';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// --- Angel / Heaven ---
let angelClouds=[];
function drawAngelBg(){
  if(angelClouds.length===0){
    for(let i=0;i<8;i++) angelClouds.push({x:Math.random()*W,y:50+Math.random()*(H*0.5),w:60+Math.random()*80,speed:0.2+Math.random()*0.3,alpha:0.3+Math.random()*0.4});
  }
  // Rays of light
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    const g=ctx.createLinearGradient(W/2,0,W/2+Math.cos(a)*300,Math.sin(a)*300);
    g.addColorStop(0,`rgba(255,240,180,${0.08+Math.sin(frame*0.02+i)*0.03})`);
    g.addColorStop(1,'rgba(255,240,180,0)');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(W/2,50);
    ctx.lineTo(W/2+Math.cos(a-0.15)*400,Math.sin(a-0.15)*400);
    ctx.lineTo(W/2+Math.cos(a+0.15)*400,Math.sin(a+0.15)*400);
    ctx.fill();
  }
  // Sun
  ctx.fillStyle=`rgba(255,240,150,${0.7+Math.sin(frame*0.03)*0.1})`;
  ctx.beginPath();ctx.arc(W/2,60,35,0,Math.PI*2);ctx.fill();
  const sg=ctx.createRadialGradient(W/2,60,10,W/2,60,80);
  sg.addColorStop(0,'rgba(255,240,150,0.4)');sg.addColorStop(1,'rgba(255,240,150,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(W/2,60,80,0,Math.PI*2);ctx.fill();
  // Clouds
  for(const cl of angelClouds){
    cl.x-=cl.speed;if(cl.x+cl.w<0)cl.x=W+cl.w;
    ctx.fillStyle=`rgba(255,255,255,${cl.alpha})`;
    ctx.beginPath();
    ctx.ellipse(cl.x,cl.y,cl.w/2,18,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cl.x+20,cl.y-10,cl.w/3,14,0,0,Math.PI*2);ctx.fill();
  }
  // Floating sparkles
  for(let i=0;i<15;i++){
    const sx=((i*137+frame*0.5)%W);
    const sy=((i*91+frame*0.3)%(H*0.7));
    const tw=Math.sin(frame*0.06+i)*0.5+0.5;
    ctx.globalAlpha=tw*0.6;
    ctx.fillStyle='#ffe066';
    ctx.beginPath();ctx.arc(sx,sy,1.5+tw,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ══ DRAW PIPE ══════════════════════════════════════════
function drawPipe(p){
  const w=getWorld();
  const capH=20,capExtra=8;
  const botY=p.topH+w.pipeGap;
  const botH=H-GROUND_H-botY;

  function drawPipeSection(x,y,pw,ph){
    // Main body
    ctx.fillStyle=w.pipeCol;
    rr(x+4,y,pw-8,ph,2);ctx.fill();
    // Left highlight
    ctx.fillStyle=w.pipeLite;
    ctx.fillRect(x+6,y,10,ph);
    // Right shadow
    ctx.fillStyle=w.pipeDark;
    ctx.fillRect(x+pw-14,y,8,ph);
    ctx.fillRect(x+pw-6,y,6,ph);
  }
  function drawCap(x,y,pw,ch){
    ctx.fillStyle=w.pipeCapCol;
    rr(x-capExtra,y,pw+capExtra*2,ch,5);ctx.fill();
    ctx.fillStyle=w.pipeLite;
    ctx.fillRect(x-capExtra+4,y+4,14,8);
    ctx.fillStyle=w.pipeDark;
    ctx.fillRect(x+pw+capExtra-14,y,8,ch);
  }
  // Top pipe
  drawPipeSection(p.x,0,PIPE_W,p.topH-capH);
  drawCap(p.x,p.topH-capH,PIPE_W,capH);
  // Bottom pipe
  drawCap(p.x,botY,PIPE_W,capH);
  drawPipeSection(p.x,botY+capH,PIPE_W,botH);

  // Danger glow on gap edges (subtle)
  if(state==='playing'){
    const bx=BIRD_X,by=bird.y;
    const dist=Math.abs(bx-(p.x+PIPE_W/2));
    if(dist<120){
      const alpha=Math.max(0,(120-dist)/120)*0.3;
      ctx.strokeStyle=`rgba(255,80,0,${alpha})`;
      ctx.lineWidth=3;
      ctx.strokeRect(p.x-capExtra,p.topH-capH,PIPE_W+capExtra*2,capH);
      ctx.strokeRect(p.x-capExtra,botY,PIPE_W+capExtra*2,capH);
    }
  }
}

// ══ DRAW GROUND ═══════════════════════════════════════
function drawGround(){
  const w=getWorld();
  ctx.fillStyle=w.groundMid;ctx.fillRect(0,H-GROUND_H,W,GROUND_H);
  ctx.fillStyle=w.groundTop;ctx.fillRect(0,H-GROUND_H,W,18);
  ctx.fillStyle=w.groundBot;ctx.fillRect(0,H-22,W,22);
  // Top border
  ctx.strokeStyle=w.groundTop;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H-GROUND_H);ctx.lineTo(W,H-GROUND_H);ctx.stroke();
  // Moving grass/detail
  const off=(frame*1.8)%50;
  ctx.fillStyle=w.groundGrassCol;
  for(let i=-50;i<W+50;i+=50){
    const tx=i-off;
    ctx.globalAlpha=0.7;
    ctx.beginPath();
    ctx.arc(tx+8,H-GROUND_H,6,Math.PI,0);
    ctx.arc(tx+18,H-GROUND_H,8,Math.PI,0);
    ctx.arc(tx+30,H-GROUND_H,5,Math.PI,0);
    ctx.arc(tx+42,H-GROUND_H,7,Math.PI,0);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  // Ground pattern
  ctx.fillStyle='rgba(0,0,0,0.1)';
  for(let i=0;i<W;i+=20){
    ctx.fillRect(i+(frame*0.8%20|0),H-GROUND_H+20,10,4);
  }
}

// ══ DRAW BIRD ═════════════════════════════════════════
function drawBird(){
  const w=getWorld();
  ctx.save();
  if(screenShake>0){
    ctx.translate(BIRD_X+(Math.random()-0.5)*screenShake,bird.y+(Math.random()-0.5)*screenShake);
  } else {
    ctx.translate(BIRD_X,bird.y);
  }
  ctx.rotate(bird.angle*Math.PI/180);

  // Trail
  for(let i=0;i<bird.trail.length;i++){
    const t=bird.trail[i];
    const a=Math.max(0,t.a);
    ctx.globalAlpha=a;
    ctx.fillStyle=w.particleA;
    ctx.beginPath();ctx.arc(bird.trail[i].x-BIRD_X,bird.trail[i].y-bird.y,6*(i/bird.trail.length),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  const wingY=bird.flapFrame>0?-8:5;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath();ctx.ellipse(3,22,15,5,0,0,Math.PI*2);ctx.fill();

  // Wing back
  ctx.fillStyle=w.birdWing;
  ctx.beginPath();ctx.ellipse(-5,wingY,14,8,-0.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=w.birdCol;
  ctx.beginPath();ctx.ellipse(-6,wingY-2,9,5,-0.5,0,Math.PI*2);ctx.fill();

  // Body
  ctx.fillStyle=w.birdCol;
  ctx.beginPath();ctx.ellipse(0,0,20,17,0,0,Math.PI*2);ctx.fill();
  // Highlight
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath();ctx.ellipse(-4,-5,11,8,-0.3,0,Math.PI*2);ctx.fill();
  // Belly
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath();ctx.ellipse(3,6,11,9,0.2,0,Math.PI*2);ctx.fill();

  // Feather detail
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-8,0);ctx.quadraticCurveTo(0,5,8,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-6,-5);ctx.quadraticCurveTo(2,-2,8,-6);ctx.stroke();

  // Eye white
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(10,-5,8,0,Math.PI*2);ctx.fill();
  // Pupil
  ctx.fillStyle='#1a0020';ctx.beginPath();ctx.arc(12,-4,5,0,Math.PI*2);ctx.fill();
  // Shine
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(13.5,-6,2,0,Math.PI*2);ctx.fill();
  // Eyebrow (expression)
  ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=2;
  ctx.beginPath();
  if(bird.vy<-2){ctx.moveTo(6,-14);ctx.lineTo(16,-12);}
  else if(bird.vy>5){ctx.moveTo(6,-12);ctx.lineTo(16,-15);}
  else{ctx.moveTo(6,-13);ctx.lineTo(16,-13);}
  ctx.stroke();

  // Beak
  ctx.fillStyle='#ff9900';
  ctx.beginPath();ctx.moveTo(18,-2);ctx.lineTo(30,1);ctx.lineTo(18,6);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffcc44';
  ctx.beginPath();ctx.moveTo(18,-2);ctx.lineTo(29,0);ctx.lineTo(18,2);ctx.closePath();ctx.fill();

  // Blush
  ctx.fillStyle='rgba(255,120,120,0.35)';
  ctx.beginPath();ctx.ellipse(7,5,6,4,0,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

// ══ DRAW PARTICLES ════════════════════════════════════
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life+0.5,0,Math.PI*2);ctx.fill();
  }
  for(const p of floatParticles){
    ctx.globalAlpha=p.alpha*0.5;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ══ DRAW HUD ══════════════════════════════════════════
function drawHUD(){
  if(state!=='playing'&&state!=='dead')return;
  const w=getWorld();

  // Score
  ctx.font='bold 56px Arial Black';
  ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillText(score,W/2+3,85);
  ctx.fillStyle='#ffffff';ctx.fillText(score,W/2,82);

  // Best badge
  if(score>0){
    ctx.font='bold 13px Arial';
    ctx.fillStyle='rgba(0,0,0,0.5)';
    rr(W-80,12,70,26,8);ctx.fill();
    ctx.fillStyle='#ffdd00';
    ctx.fillText('BEST '+best,W-45,30);
  }

  // World badge
  ctx.font='bold 13px Arial';
  ctx.fillStyle='rgba(0,0,0,0.4)';
  rr(8,12,82,26,8);ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.textAlign='left';
  ctx.fillText(w.music+' '+w.id.toUpperCase(),14,30);
  ctx.textAlign='center';

  // Combo
  if(combo>=3&&comboTimer>0){
    const alpha=Math.min(1,comboTimer/30);
    ctx.globalAlpha=alpha;
    ctx.font='bold 22px Arial Black';
    ctx.fillStyle='#ffdd00';
    ctx.fillText('🔥 COMBO x'+combo+'!',W/2,130);
    ctx.globalAlpha=1;
  }
}

// ══ SCREEN: IDLE ══════════════════════════════════════
function drawIdle(){
  const w=getWorld();
  // Panel
  ctx.fillStyle='rgba(0,0,0,0.72)';rr(W/2-145,H/2-145,290,160,20);ctx.fill();
  ctx.strokeStyle=w.particleA;ctx.lineWidth=2;
  rr(W/2-145,H/2-145,290,160,20);ctx.stroke();

  // Title
  ctx.font='bold 40px Arial Black';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillText('FLOPPY BIRD',W/2+3,H/2-93);
  ctx.fillStyle=w.particleA;ctx.fillText('FLOPPY BIRD',W/2,H/2-96);

  ctx.font='bold 13px Arial';ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('PRO EDITION',W/2,H/2-72);

  // World name
  ctx.font='bold 18px Arial';ctx.fillStyle='#ffffff';
  ctx.fillText(w.name,W/2,H/2-44);

  // Tap hint
  const bounce=Math.sin(frame*0.08)*5;
  ctx.font='bold 15px Arial';ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.fillText('TAP or SPACE to fly!',W/2,H/2-16+bounce);

  // World selector
  drawWorldSelector();
}

function drawWorldSelector(){
  ctx.font='bold 12px Arial';
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText('— SELECT WORLD —',W/2,H/2+36);

  const boxW=46,gap=6,totalW=WORLDS.length*(boxW+gap)-gap;
  const startX=(W-totalW)/2;

  for(let i=0;i<WORLDS.length;i++){
    const wx=startX+i*(boxW+gap);
    const wy=H/2+44;
    const ww=WORLDS[i];
    const unlocked=worldBests[0]>=ww.unlockAt||i===0;
    const isCurrent=i===currentWorldIdx;

    ctx.fillStyle=isCurrent?'rgba(255,220,0,0.35)':'rgba(255,255,255,0.08)';
    rr(wx,wy,boxW,52,8);ctx.fill();
    if(isCurrent){ctx.strokeStyle='#ffdd00';ctx.lineWidth=2;rr(wx,wy,boxW,52,8);ctx.stroke();}

    ctx.font='20px Arial';ctx.textAlign='center';
    ctx.globalAlpha=unlocked?1:0.4;
    ctx.fillStyle='#fff';ctx.fillText(ww.music,wx+boxW/2,wy+24);
    ctx.font='bold 9px Arial';
    ctx.fillStyle=unlocked?'#ffffff':'#888888';
    ctx.fillText(unlocked?ww.id.toUpperCase():'🔒',wx+boxW/2,wy+40);
    ctx.globalAlpha=1;
  }
}

// Touch world selector buttons
C.addEventListener('pointerdown',e=>{
  if(state!=='idle')return;
  const rect=C.getBoundingClientRect();
  const cx=(e.clientX-rect.left)/scale;
  const cy=(e.clientY-rect.top)/scale;
  const boxW=46,gap=6,totalW=WORLDS.length*(boxW+gap)-gap;
  const startX=(W-totalW)/2;
  for(let i=0;i<WORLDS.length;i++){
    const wx=startX+i*(boxW+gap);
    const wy=H/2+44;
    if(cx>=wx&&cx<=wx+boxW&&cy>=wy&&cy<=wy+52){
      const unlocked=worldBests[0]>=WORLDS[i].unlockAt||i===0;
      if(unlocked){currentWorldIdx=i;spawnFloatParticles();}
      return;
    }
  }
});

// ══ SCREEN: DEAD ══════════════════════════════════════
function drawDead(){
  const w=getWorld();
  // Overlay
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);

  // Panel
  ctx.fillStyle='rgba(0,0,0,0.85)';rr(W/2-155,H/2-175,310,260,22);ctx.fill();
  ctx.strokeStyle='#cc2244';ctx.lineWidth=3;rr(W/2-155,H/2-175,310,260,22);ctx.stroke();

  // Title
  ctx.font='bold 42px Arial Black';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillText('GAME OVER',W/2+3,H/2-120);
  ctx.fillStyle='#ff4444';ctx.fillText('GAME OVER',W/2,H/2-123);

  // Divider
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-120,H/2-98);ctx.lineTo(W/2+120,H/2-98);ctx.stroke();

  // Score block
  ctx.fillStyle='rgba(255,255,255,0.06)';rr(W/2-100,H/2-90,200,90,10);ctx.fill();
  ctx.font='bold 13px Arial';ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText('SCORE',W/2,H/2-68);
  ctx.font='bold 44px Arial Black';
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillText(score,W/2+2,H/2-28);
  ctx.fillStyle='#ffdd00';ctx.fillText(score,W/2,H/2-31);
  ctx.font='bold 14px Arial';
  ctx.fillStyle=score>=worldBests[currentWorldIdx]?'#88ff88':'#88aaff';
  ctx.fillText((score>=worldBests[currentWorldIdx]&&score>0?'🏆 NEW BEST! ':'BEST ')+best,W/2,H/2-10);

  // World score
  ctx.font='bold 12px Arial';ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText(w.name+' Best: '+worldBests[currentWorldIdx],W/2,H/2+14);

  // Check unlocks
  let nextUnlock=null;
  for(const world of WORLDS){
    if(worldBests[0]<world.unlockAt&&world.id!=='forest'){
      nextUnlock=world;break;
    }
  }
  if(nextUnlock){
    ctx.font='bold 11px Arial';ctx.fillStyle='rgba(255,200,0,0.8)';
    ctx.fillText('🔒 '+nextUnlock.name+' unlocks at '+nextUnlock.unlockAt,W/2,H/2+38);
  }

  // Tap to retry
  const pulse=0.65+0.35*Math.abs(Math.sin(frame*0.07));
  ctx.globalAlpha=pulse;
  ctx.fillStyle='rgba(0,0,0,0.5)';rr(W/2-90,H/2+54,180,38,10);ctx.fill();
  ctx.fillStyle='#ffffff';ctx.font='bold 16px Arial';
  ctx.fillText('▶  TAP TO RETRY',W/2,H/2+78);
  ctx.globalAlpha=1;
}

// ══ MAIN LOOP ══════════════════════════════════════════
function loop(){
  update();

  // Screen shake transform
  ctx.save();
  if(screenShake>0){
    ctx.translate((Math.random()-0.5)*screenShake*0.5,(Math.random()-0.5)*screenShake*0.5);
  }

  drawSky();
  drawBgDeco();
  for(const p of pipes)drawPipe(p);
  drawGround();
  drawParticles();
  drawBird();
  ctx.restore();

  drawHUD();

  if(state==='idle')drawIdle();
  if(state==='dead')drawDead();

  requestAnimationFrame(loop);
}

loop();
</script>
